<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard | EyeTic 👁️</title>
  <meta name="description" content="Global player standings and gaze tracking rankings for EyeTic.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .leaderboard-page-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 24px 60px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .lb-header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }

    .lb-hero {
      text-align: center;
      margin-top: 10px;
    }

    .lb-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 30px;
      color: var(--gold-primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .lb-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 40%, var(--gold-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .lb-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Podium Display */
    .podium-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      margin: 20px auto 10px;
      max-width: 780px;
      width: 100%;
      min-height: 280px;
    }

    .podium-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .podium-player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
      transition: transform 0.2s ease;
    }

    .podium-player-card:hover {
      transform: translateY(-4px);
    }

    .podium-avatar-wrapper {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      position: relative;
      background: #0f172a;
      border: 2px solid var(--text-dim);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .podium-step.rank-1 .podium-avatar-wrapper {
      width: 84px;
      height: 84px;
      font-size: 38px;
      border-color: var(--gold-primary);
      box-shadow: 0 0 25px var(--gold-glow);
    }

    .podium-step.rank-2 .podium-avatar-wrapper {
      border-color: #94a3b8;
      box-shadow: 0 0 18px rgba(148, 163, 184, 0.4);
    }

    .podium-step.rank-3 .podium-avatar-wrapper {
      border-color: #d97706;
      box-shadow: 0 0 18px rgba(217, 119, 6, 0.4);
    }

    .podium-crown {
      position: absolute;
      top: -18px;
      font-size: 22px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    .podium-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .podium-points {
      font-size: 14px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--cyan-primary);
    }

    .podium-pillar {
      width: 100%;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 26px;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.15), 0 10px 30px rgba(0,0,0,0.5);
    }

    .podium-step.rank-1 .podium-pillar {
      height: 150px;
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.28) 0%, rgba(180, 83, 9, 0.18) 100%);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: var(--gold-primary);
    }

    .podium-step.rank-2 .podium-pillar {
      height: 110px;
      background: linear-gradient(180deg, rgba(148, 163, 184, 0.24) 0%, rgba(51, 65, 85, 0.18) 100%);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #cbd5e1;
    }

    .podium-step.rank-3 .podium-pillar {
      height: 80px;
      background: linear-gradient(180deg, rgba(217, 119, 6, 0.24) 0%, rgba(120, 53, 15, 0.18) 100%);
      border: 1px solid rgba(217, 119, 6, 0.35);
      color: #f59e0b;
    }

    /* Filters Bar */
    .filter-tabs-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-tabs {
      display: flex;
      background: var(--bg-card);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }

    .filter-tab {
      padding: 8px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-tab.active {
      background: var(--cyan-primary);
      color: #040d1a;
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    /* Table */
    .leaderboard-table-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .lb-table th {
      background: rgba(15, 23, 42, 0.8);
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lb-table td {
      padding: 16px 20px;
      font-size: 14px;
      color: var(--text-primary);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.15s ease;
    }

    .lb-table tr:hover td {
      background: rgba(56, 189, 248, 0.05);
    }

    .lb-table tr.user-row td {
      background: rgba(56, 189, 248, 0.12);
      border-top: 1px solid rgba(56, 189, 248, 0.3);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
    }

    .rank-cell {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 16px;
      width: 70px;
    }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .player-name-wrap {
      display: flex;
      flex-direction: column;
    }

    .player-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .player-tag {
      font-size: 11px;
      color: var(--text-dim);
    }

    .points-val {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 16px;
      color: var(--cyan-primary);
    }

    .winrate-bar-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .winrate-track {
      width: 80px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .winrate-fill {
      height: 100%;
      background: var(--emerald-primary);
      border-radius: 3px;
    }

    .badge-you {
      display: inline-block;
      padding: 2px 8px;
      background: var(--cyan-primary);
      color: #040d1a;
      font-size: 10px;
      font-weight: 800;
      border-radius: 12px;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="background-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="leaderboard-page-container">
    <!-- Navigation Header -->
    <header class="lb-header-nav">
      <div class="brand">
        <a href="/" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
              <circle cx="12" cy="12" r="1" fill="currentColor" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>EYETIC</h1>
            <span class="badge-vision">LEADERBOARD</span>
          </div>
        </a>
      </div>

      <div class="header-actions">
        <a href="/" class="btn-primary" style="text-decoration: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Return to Game</span>
        </a>

        <div id="userNavSlot" style="margin-left: 8px;">
          <!-- Populated by JS -->
        </div>
      </div>
    </header>

    <!-- Hero Title -->
    <section class="lb-hero">
      <div class="lb-badge">🏆 HALL OF FAME</div>
      <h1 class="lb-title">Global Gaze Champions</h1>
      <p class="lb-subtitle">Players ranked by gaze-controlled precision, Minimax difficulty conquests, and winning records.</p>
    </section>

    <!-- Podium Section -->
    <section class="podium-container" id="podiumSection">
      <!-- 2nd Place -->
      <div class="podium-step rank-2" id="podium2">
        <div class="podium-player-card">
          <div class="podium-avatar-wrapper" id="p2Avatar">⚡</div>
          <div class="podium-name" id="p2Name">---</div>
          <div class="podium-points" id="p2Points">0 PTS</div>
        </div>
        <div class="podium-pillar">2</div>
      </div>

      <!-- 1st Place -->
      <div class="podium-step rank-1" id="podium1">
        <div class="podium-player-card">
          <span class="podium-crown">👑</span>
          <div class="podium-avatar-wrapper" id="p1Avatar">👁️</div>
          <div class="podium-name" id="p1Name">---</div>
          <div class="podium-points" id="p1Points">0 PTS</div>
        </div>
        <div class="podium-pillar">1</div>
      </div>

      <!-- 3rd Place -->
      <div class="podium-step rank-3" id="podium3">
        <div class="podium-player-card">
          <div class="podium-avatar-wrapper" id="p3Avatar">🦅</div>
          <div class="podium-name" id="p3Name">---</div>
          <div class="podium-points" id="p3Points">0 PTS</div>
        </div>
        <div class="podium-pillar">3</div>
      </div>
    </section>

    <!-- Filters Bar -->
    <div class="filter-tabs-wrapper">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">🏆 Overall Points</button>
        <button class="filter-tab" data-filter="hard">💀 Hard AI Masters</button>
        <button class="filter-tab" data-filter="wins">🎯 Most Wins</button>
        <button class="filter-tab" data-filter="win_rate">⚡ Win Rate %</button>
      </div>

      <button id="refreshBtn" class="btn-secondary" title="Refresh Live Rankings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>Refresh</span>
      </button>
    </div>

    <!-- Leaderboard Table Card -->
    <div class="leaderboard-table-card">
      <table class="lb-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Pilot</th>
            <th>Points</th>
            <th>Win Rate</th>
            <th>Record (W - L - D)</th>
            <th>Hard Victories</th>
          </tr>
        </thead>
        <tbody id="leaderboardTbody">
          <!-- Populated by JS -->
          <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Loading champions...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentFilter = 'all';
    let currentUser = null;

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        const slot = document.getElementById('userNavSlot');
        if (data.authenticated && data.user) {
          currentUser = data.user;
          slot.innerHTML = `
            <div style="display: flex; align-items: center; gap: 8px; background: rgba(56, 189, 248, 0.15); border: 1px solid var(--border-active); padding: 6px 14px; border-radius: 20px;">
              <span>${data.user.avatar || '👁️'}</span>
              <span style="font-weight: 700; font-size: 13px;">${data.user.username}</span>
              <button onclick="logout()" class="btn-text-subtle" style="font-size: 12px; margin-left: 4px;">Logout</button>
            </div>
          `;
        } else {
          slot.innerHTML = `
            <a href="/login" class="btn-secondary" style="text-decoration: none;">
              <span>Sign In / Join</span>
            </a>
          `;
        }
      } catch (e) {}
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.reload();
    }

    async function loadLeaderboard() {
      try {
        const res = await fetch(`/api/leaderboard?filter=${currentFilter}`);
        const data = await res.json();
        if (data.success && data.leaderboard) {
          renderPodium(data.leaderboard);
          renderTable(data.leaderboard);
        }
      } catch (e) {}
    }

    function renderPodium(list) {
      const podium = document.getElementById('podiumSection');
      if (!list || list.length === 0) {
        podium.style.display = 'none';
        return;
      }
      podium.style.display = 'flex';

      const p1 = list[0] || null;
      const p2 = list[1] || null;
      const p3 = list[2] || null;

      const pod1 = document.getElementById('podium1');
      const pod2 = document.getElementById('podium2');
      const pod3 = document.getElementById('podium3');

      if (p1) {
        pod1.style.display = 'flex';
        document.getElementById('p1Avatar').textContent = p1.avatar || '👁️';
        document.getElementById('p1Name').textContent = p1.username;
        document.getElementById('p1Points').textContent = `${p1.points} PTS`;
      } else {
        pod1.style.display = 'none';
      }

      if (p2) {
        pod2.style.display = 'flex';
        document.getElementById('p2Avatar').textContent = p2.avatar || '⚡';
        document.getElementById('p2Name').textContent = p2.username;
        document.getElementById('p2Points').textContent = `${p2.points} PTS`;
      } else {
        pod2.style.display = 'none';
      }

      if (p3) {
        pod3.style.display = 'flex';
        document.getElementById('p3Avatar').textContent = p3.avatar || '🦅';
        document.getElementById('p3Name').textContent = p3.username;
        document.getElementById('p3Points').textContent = `${p3.points} PTS`;
      } else {
        pod3.style.display = 'none';
      }
    }

    function renderTable(list) {
      const tbody = document.getElementById('leaderboardTbody');
      tbody.innerHTML = '';

      if (!list || list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 50px 20px;">
              <div style="font-size: 36px; margin-bottom: 10px;">🎯</div>
              <div style="font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;">No players on the leaderboard yet</div>
              <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">Play a match or create an account to claim rank #1!</div>
              <a href="/" class="btn-primary" style="display: inline-flex; text-decoration: none; padding: 8px 18px; font-size: 13px;">Play Now</a>
            </td>
          </tr>
        `;
        return;
      }

      list.forEach((item, idx) => {
        const tr = document.createElement('tr');
        const isMe = currentUser && currentUser.username.toLowerCase() === item.username.toLowerCase();
        if (isMe) tr.className = 'user-row';

        let rankBadge = `#${item.rank}`;
        if (item.rank === 1) rankBadge = '🥇 #1';
        else if (item.rank === 2) rankBadge = '🥈 #2';
        else if (item.rank === 3) rankBadge = '🥉 #3';

        tr.innerHTML = `
          <td class="rank-cell">${rankBadge}</td>
          <td>
            <div class="player-cell">
              <div class="player-avatar">${item.avatar || '👁️'}</div>
              <div class="player-name-wrap">
                <span class="player-name">
                  ${item.username}
                  ${isMe ? '<span class="badge-you">YOU</span>' : ''}
                </span>
                <span class="player-tag">${item.matches} matches played</span>
              </div>
            </div>
          </td>
          <td><span class="points-val">${item.points}</span></td>
          <td>
            <div class="winrate-bar-container">
              <div class="winrate-track">
                <div class="winrate-fill" style="width: ${Math.min(100, item.win_rate)}%;"></div>
              </div>
              <span style="font-family: var(--font-mono); font-size: 13px;">${item.win_rate}%</span>
            </div>
          </td>
          <td style="font-family: var(--font-mono); font-size: 13px;">
            <span style="color: var(--emerald-primary); font-weight: 700;">${item.wins}W</span>
            <span style="color: var(--crimson-primary); font-weight: 700; margin-left: 6px;">${item.losses}L</span>
            <span style="color: var(--text-dim); margin-left: 6px;">${item.draws}D</span>
          </td>
          <td style="font-family: var(--font-mono); font-size: 13px; color: var(--gold-primary); font-weight: 700;">
            ${item.hard_wins || 0}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        loadLeaderboard();
      });
    });

    document.getElementById('refreshBtn').addEventListener('click', loadLeaderboard);

    checkAuth().then(loadLeaderboard);
  </script>
</body>
</html>
